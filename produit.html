<!doctype html>
<html lang="fr">
  <head>
    <!-- @include head.html -->
    <title>Boutique · Distillerie A. Blachère</title>
    <meta name="description" content="Fiche produit de la boutique de la Distillerie A. Blachère, Châteauneuf-du-Pape." />
    <meta name="theme-color" content="#17170f" />
    <!-- Une page pour les 63 fiches tant qu'elles ne sont pas pré-rendues : l'adresse canonique
         (/boutique/<fiche>), og:url, le titre et la description de la fiche sont posés par
         src/pages/produit.js ; une adresse commune ici serait fausse pour chaque fiche. -->
    <meta property="og:title" content="Boutique · Distillerie A. Blachère" />
    <meta property="og:description" content="Sirops et spiritueux de la Distillerie A. Blachère, à Châteauneuf-du-Pape&nbsp;: prix, contenances, ingrédients, conseils et recettes." />
  </head>
  <body data-page="boutique">
    <!-- @include header.html -->
    <main id="contenu" class="product-page">
      <div id="product-root" aria-live="polite">
        <div class="wrap product-loading"><p>Chargement de la fiche…</p></div>
      </div>
      <section class="related wrap" id="related" aria-labelledby="related-title" hidden>
        <h2 class="h-section" id="related-title">Vous aimerez aussi</h2>
        <ul class="grid related__grid" id="related-grid"></ul>
      </section>
    </main>
    <!-- @include footer.html -->
    <!-- @include dialogs.html -->
    <script type="module" src="/src/pages/produit.js"></script>
    <script src="/v2x/proposition.js" defer></script>
  </body>
</html>
